name: Quality

# Deterministic test gates.
#   unit        fast, database-free feedback (stack-gated tests skip by design;
#               the guard verifies that ONLY stack-gated files skip).
#   regression  the full suite against a clean local Supabase stack (Docker on
#               the GitHub-hosted runner). Zero failures and zero unknown skips
#               are required: the closed allowlist in
#               .github/ci/skip-allowlist.json is the only place a skip may be
#               declared, and stale allowlist entries fail the job too.
# Typecheck and build live in ci.yml and are independent jobs, so they always
# run even when a test job fails.
# No production or repository secrets are used anywhere. The local stack's
# API keys are read from the CLI, masked immediately, never printed, and never
# written to an artifact; only a redacted summary is uploaded.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  SUPABASE_CLI_VERSION: 2.117.0
  # Pattern used to scrub any JWT-shaped text from streamed test output.
  JWT_SCRUB: 's/eyJ[A-Za-z0-9_-]{8,}(\.[A-Za-z0-9_-]+){0,2}/[REDACTED_JWT]/g'

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # actions/checkout v6.0.3
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      # actions/setup-node v6.5.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Database-free test run
        run: |
          set -o pipefail
          npx vitest run --reporter=default --reporter=json \
            --outputFile.json="$RUNNER_TEMP/vitest-unit.json" 2>&1 | sed -E -u "$JWT_SCRUB"
      - name: Guard (failures and non-stack skips)
        if: always()
        run: |
          node scripts/ci-skip-guard.ts --report "$RUNNER_TEMP/vitest-unit.json" \
            --mode stackless --summary-dir "$RUNNER_TEMP/ci-summary"
      - name: Publish redacted summary
        if: always()
        run: |
          f="$RUNNER_TEMP/ci-summary/summary-stackless.md"
          if [ -f "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; fi
      # actions/upload-artifact v6.0.0
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: unit-summary
          path: ${{ runner.temp }}/ci-summary
          if-no-files-found: ignore
          retention-days: 7

  regression:
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      # actions/checkout v6.0.3
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      # actions/setup-node v6.5.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # supabase/setup-cli v2.1.1
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Authenticate and verify GHCR image pull
        timeout-minutes: 5
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set +x
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin > /dev/null
          image="ghcr.io/supabase/postgres-meta:v0.99.0"
          if ! docker pull "$image"; then
            echo "::error title=Authenticated GHCR image pull failed::Could not pull $image before Supabase stack startup"
            exit 1
          fi
          echo "authenticated GHCR image pull succeeded: $image"

      - name: Start clean local Supabase stack
        timeout-minutes: 20
        run: |
          set +x
          # The CLI prints the local API keys on start: send everything to a
          # file, never to the job log. vector/logflare (log shipping) and
          # studio (UI) are not needed by the suite. Migrations in
          # supabase/migrations are applied automatically on a fresh stack.
          if ! supabase start -x logflare,vector,studio > "$RUNNER_TEMP/supabase-start.log" 2>&1; then
            echo "::error title=Supabase stack startup failed::The authenticated image pull passed, but the local Supabase stack did not start"
            echo "redacted tail of the start log:"
            tail -n 80 "$RUNNER_TEMP/supabase-start.log" | sed -E "$JWT_SCRUB"
            exit 1
          fi
          # Mask every credential-like value the CLI knows about, immediately,
          # so nothing later in this job can print it.
          while IFS='=' read -r key value; do
            case "$key" in
              ANON_KEY|SERVICE_ROLE_KEY|PUBLISHABLE_KEY|SECRET_KEY|JWT_SECRET|DB_URL|S3_PROTOCOL_ACCESS_KEY_ID|S3_PROTOCOL_ACCESS_KEY_SECRET)
                value="${value%\"}"; value="${value#\"}"
                [ -n "$value" ] && echo "::add-mask::$value"
                ;;
            esac
          done < <(supabase status -o env 2>/dev/null)
          echo "local Supabase stack started"

      - name: Wait for database, GoTrue and PostgREST
        timeout-minutes: 5
        run: |
          set +x
          ANON_KEY=""
          while IFS='=' read -r key value; do
            if [ "$key" = "ANON_KEY" ]; then value="${value%\"}"; ANON_KEY="${value#\"}"; fi
          done < <(supabase status -o env 2>/dev/null)
          [ -n "$ANON_KEY" ] || { echo "could not read the local anon key"; exit 1; }
          wait_for() {
            local name="$1"; shift
            for attempt in $(seq 1 60); do
              if "$@" >/dev/null 2>&1; then echo "$name ready (attempt $attempt)"; return 0; fi
              sleep 2
            done
            echo "$name did not become ready within 120s"; return 1
          }
          wait_for "database" docker exec supabase_db_WillViralFinal pg_isready -U postgres
          wait_for "gotrue" curl -fsS -o /dev/null -H "apikey: ${ANON_KEY}" http://127.0.0.1:54321/auth/v1/health
          wait_for "postgrest" curl -fsS -o /dev/null -H "apikey: ${ANON_KEY}" http://127.0.0.1:54321/rest/v1/

      - name: Verify migration files match the clean stack history
        run: |
          set +x
          export LC_ALL=C
          expected="$(find supabase/migrations -maxdepth 1 -name '*.sql' -printf '%f\n' | sed -E 's#^([0-9]+)_.*#\1#' | sort)"
          applied="$(docker exec supabase_db_WillViralFinal psql -U postgres -d postgres -X -A -t \
            -c 'select version from supabase_migrations.schema_migrations order by version' | sort)"
          echo "migration files: $(echo "$expected" | wc -l), applied history rows: $(echo "$applied" | wc -l)"
          if ! diff <(echo "$expected") <(echo "$applied"); then
            echo "migration files and stack history differ (diff above: '<' file only, '>' history only)"
            exit 1
          fi
          echo "migration history matches the repository files"

      - name: Full test suite
        timeout-minutes: 75
        run: |
          set +x
          set -o pipefail
          npx vitest run --reporter=default --reporter=json \
            --outputFile.json="$RUNNER_TEMP/vitest-full.json" 2>&1 | sed -E -u "$JWT_SCRUB"

      - name: Guard (failures, unknown skips, stale allowlist)
        if: always()
        run: |
          node scripts/ci-skip-guard.ts --report "$RUNNER_TEMP/vitest-full.json" \
            --mode full --summary-dir "$RUNNER_TEMP/ci-summary"

      - name: Publish redacted summary
        if: always()
        run: |
          f="$RUNNER_TEMP/ci-summary/summary-full.md"
          if [ -f "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; fi

      # Only the redacted summary is uploaded. The raw vitest report, the
      # stack start log and container logs are never uploaded.
      # actions/upload-artifact v6.0.0
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: regression-summary
          path: ${{ runner.temp }}/ci-summary
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop and remove the Supabase stack
        if: always()
        run: |
          set +x
          supabase stop --no-backup > /dev/null 2>&1
          remaining="$(docker ps -aq --filter 'name=supabase_' | wc -l)"
          echo "remaining supabase containers: $remaining"
          [ "$remaining" = "0" ]
